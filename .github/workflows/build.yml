name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream xezim tag to build (for example 0.11.4)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: aionhw/xezim
          ref: ${{ inputs.tag }}
          fetch-depth: 1
          fetch-tags: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Upstream 0.11.6+ ships .cargo/config.toml with an `include = [{ ... }]`
      # table entry that the runner cargo cannot parse, and a clang linker script
      # aimed at developer machines. Prebuilt CI binaries built fine on 0.11.5
      # with the default toolchain, so drop the file for the package build only.
      - name: Use default Cargo toolchain
        run: rm -f .cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Check version
        run: ./target/release/xezim -V | tee version.txt

      - name: Package
        run: |
          mkdir -p dist/bin
          cp target/release/xezim dist/bin/xezim
          tar -C dist -czf xezim-ubuntu-24.04.tar.gz bin
          tar -tzf xezim-ubuntu-24.04.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: xezim-ubuntu-24.04.tar.gz
          fail_on_unmatched_files: true
          body: |
            Prebuilt xezim ${{ inputs.tag }} for ubuntu-24.04.
            Source: https://github.com/aionhw/xezim/tree/${{ inputs.tag }}
            Archive layout: `bin/xezim`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
